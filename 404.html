<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e9">
  <title>Page not found · Little Quest</title>
  <style>
    :root{color-scheme:light;--cream:#f6f2e9;--paper:#fffefa;--sage:#617e63;--forest:#3d5b44;--gold:#d8aa55;--ink:#35443a;--muted:#758174}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.7),transparent 58%),var(--cream);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
    main{width:min(100%,520px);padding:46px 30px;text-align:center;border:1px solid rgba(255,255,255,.96);border-radius:29px;background:var(--paper);box-shadow:0 10px 0 var(--forest),0 26px 55px rgba(64,77,57,.15)}
    .star{color:var(--gold);font-size:2rem}
    h1{margin:12px 0 10px;font:400 clamp(2rem,7vw,3rem)/1.1 Georgia,"Times New Roman",serif}
    p{margin:0 auto 25px;max-width:34rem;color:var(--muted);line-height:1.55}
    a{display:inline-block;padding:12px 20px;border-radius:999px;background:var(--sage);color:#fff;text-decoration:none;font-weight:700;box-shadow:0 4px 0 var(--forest);transition:transform .2s}
    a:hover{transform:translateY(-2px)}
    a:active{transform:translateY(2px);box-shadow:0 1px 0 var(--forest)}
  </style>
</head>
<body>
  <main>
    <div class="star" aria-hidden="true">✦</div>
    <h1>Page not found</h1>
    <p>This little path does not lead to a quest. Return to the beginning and choose a set.</p>
    <a href="./index.html">Back to Little Quest</a>
  </main>
</body>
</html>
